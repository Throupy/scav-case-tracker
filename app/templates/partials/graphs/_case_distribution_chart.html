<div class="card shadow">
    <div class="card-header py-3 d-flex flex-row align-items-center justify-content-between">
        <h6 class="m-0 font-weight-bold text-accent">Case Type Distribution</h6>
    </div>

    <div class="card-body">
        <div class="chart-pie">
            <canvas id="caseTypeDistribution"></canvas>
        </div>
    </div>
</div>

<script>
    function applyCaseDistributionTheme(chart) {
        if (!chart) return;

        const dark = document.documentElement.classList.contains("dark");
        const text = dark ? "#d8dbe5" : "#6e707e";
        const grid = dark ? "rgba(255, 255, 255, 0.07)" : "rgba(78, 115, 223, 0.08)";
        const accent = window.themeAccent();

        chart.options.scales.x.ticks.color = text;
        chart.options.scales.x.grid.color = grid;
        chart.options.scales.y.ticks.color = text;
        chart.data.datasets[0].backgroundColor = window.themeAccent(0.78);
        chart.data.datasets[0].hoverBackgroundColor = accent;
        chart.data.datasets[0].borderColor = accent;

        chart.options.plugins.tooltip.backgroundColor = dark ? "#151924" : "#ffffff";
        chart.options.plugins.tooltip.titleColor = dark ? "#ffffff" : "#6e707e";
        chart.options.plugins.tooltip.bodyColor = dark ? "#ffffff" : "#858796";
        chart.options.plugins.tooltip.borderColor = dark ? "#2a3142" : "#dddfeb";
        chart.$valueLabelColor = dark ? "#f3f4f8" : "#4b4f5c";

        chart.update();
    }

    let _pieChart = null;

    async function fetchDistributionData() {
        const days = window.dashboardDays || 0;
        const scope = window.dashboardScope || "global";
        const params = new URLSearchParams();
        if (days > 0) params.set("days", days);
        if (scope !== "global") params.set("scope", scope);
        const qs = params.toString();
        const url = "/api/scav-case-type-distribution" + (qs ? "?" + qs : "");

        try {
            const response = await fetch(url);
            const payload = await response.json();
            const rows = Object.entries(payload.data)
                .map(([label, value]) => ({ label, value: Number(value) }))
                .sort((a, b) => b.value - a.value);

            if (_pieChart) {
                _pieChart.data.labels = rows.map(row => row.label);
                _pieChart.data.datasets[0].data = rows.map(row => row.value);
                _pieChart.update();
            }
        } catch (error) {
            console.error("Error fetching Scav Case Type Distribution data:", error);
        }
    }

    document.addEventListener("DOMContentLoaded", function () {
        const ctx = document.getElementById("caseTypeDistribution");

        _pieChart = new Chart(ctx, {
            type: "bar",
            data: {
                labels: [],
                datasets: [{
                    label: "Cases",
                    data: [],
                    backgroundColor: window.themeAccent(0.78),
                    hoverBackgroundColor: window.themeAccent(),
                    borderColor: window.themeAccent(),
                    borderWidth: 1,
                    borderRadius: 6,
                    borderSkipped: false,
                    maxBarThickness: 26
                }]
            },
            options: {
                indexAxis: "y",
                maintainAspectRatio: false,
                devicePixelRatio: 3,
                animation: {
                    duration: 500
                },
                layout: {
                    padding: {
                        right: 72
                    }
                },
                scales: {
                    x: {
                        beginAtZero: true,
                        grace: "20%",
                        ticks: {
                            precision: 0,
                            maxTicksLimit: 5
                        },
                        grid: {
                            drawBorder: false
                        }
                    },
                    y: {
                        grid: {
                            display: false,
                            drawBorder: false
                        },
                        ticks: {
                            font: {
                                weight: "600"
                            }
                        }
                    }
                },
                plugins: {
                    legend: {
                        display: false
                    },
                    tooltip: {
                        enabled: true,
                        displayColors: false,
                        padding: 12,
                        caretPadding: 8,
                        callbacks: {
                            label(context) {
                                const values = context.dataset.data;
                                const total = values.reduce((sum, value) => sum + Number(value || 0), 0);
                                const value = Number(context.raw || 0);
                                const percentage = total ? ((value / total) * 100).toFixed(1) : "0.0";
                                return value.toLocaleString() + " cases (" + percentage + "%)";
                            }
                        }
                    }
                }
            }
        });

        applyCaseDistributionTheme(_pieChart);

        document.addEventListener("theme:changed", function () {
            setTimeout(() => applyCaseDistributionTheme(_pieChart), 0);
        });
        document.addEventListener("dashboard:time-changed", fetchDistributionData);

        fetchDistributionData();
    });
</script>
