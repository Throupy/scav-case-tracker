<div class="card border-left-danger shadow h-100 py-2">
    <div class="card-body">
        <div class="row no-gutters align-items-center">
            <div class="col mr-2">
                <div class="text-xs font-weight-bold text-danger text-uppercase mb-1">Win Rate</div>

                {% if win_rate is not none %}
                <div class="h5 mb-0 font-weight-bold text-gray-800" data-kpi="win-rate-result">
                    {{ "%.1f"|format(win_rate) }}%
                </div>
                {% else %}
                <div class="h5 mb-0 font-weight-bold text-gray-800" data-kpi="win-rate-result">N/A</div>
                {% endif %}
            </div>
            <div class="col-auto">
                <i class="fas fa-percentage fa-2x text-gray-300"></i>
            </div>
        </div>
    </div>
</div>
