<div class="card border-left-danger shadow h-100 py-2">
    <div class="card-body">
        <div class="row no-gutters align-items-center">
            <div class="col mr-2">
                <div class="text-xs font-weight-bold text-danger text-uppercase mb-1">Average ROI</div>

                {% if average_roi is not none %}
                <div class="h5 mb-0 font-weight-bold text-gray-800" data-kpi="avg-roi-result">
                    {{ "%.1f"|format(average_roi) }}%
                </div>
                {% else %}
                <div class="h5 mb-0 font-weight-bold text-gray-800" data-kpi="avg-roi-result">N/A</div>
                {% endif %}
            </div>
            <div class="col-auto">
                <i class="fas fa-chart-line fa-2x text-gray-300"></i>
            </div>
        </div>
    </div>
</div>
